AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Data tier, an Amazon RDS MySQL instance in Multi-AZ, encrypted with the
  workload KMS key, reachable only from the app tier, requiring TLS on every
  connection. Credentials come from the Secrets Manager secret created in the
  security stack. Deploy after the network and security stacks.

Parameters:
  ProjectName:
    Type: String
    Default: enpm818n-grp21
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35

Resources:
  DbSubnetGroup:
    Type: "AWS::RDS::DBSubnetGroup"
    Properties:
      DBSubnetGroupDescription: Private data tier across two AZs
      SubnetIds:
        - Fn::ImportValue: !Sub "${ProjectName}-DataSubnetA"
        - Fn::ImportValue: !Sub "${ProjectName}-DataSubnetB"
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-db-subnets" }]

  # Refuse any connection that is not over TLS.
  DbParameterGroup:
    Type: "AWS::RDS::DBParameterGroup"
    Properties:
      Description: Require TLS on every connection
      Family: mysql8.0
      Parameters:
        require_secure_transport: "1"

  Database:
    Type: "AWS::RDS::DBInstance"
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: mysql
      EngineVersion: "8.0.43"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      MaxAllocatedStorage: 100
      StorageType: gp3
      DBName: ecommerce
      MultiAZ: true
      StorageEncrypted: true
      KmsKeyId:
        Fn::ImportValue: !Sub "${ProjectName}-WorkloadKeyArn"
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBParameterGroupName: !Ref DbParameterGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub "${ProjectName}-DatabaseSecurityGroupId"
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref BackupRetentionDays
      PreferredBackupWindow: "03:00-04:00"
      CopyTagsToSnapshot: true
      DeletionProtection: true
      EnablePerformanceInsights: true
      EnableCloudwatchLogsExports: [error, slowquery]
      MasterUsername:
        Fn::Sub:
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:username}}"
          - SecretArn:
              Fn::ImportValue: !Sub "${ProjectName}-DatabaseSecretArn"
      MasterUserPassword:
        Fn::Sub:
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:password}}"
          - SecretArn:
              Fn::ImportValue: !Sub "${ProjectName}-DatabaseSecretArn"
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-db" }
        - { Key: Project, Value: !Ref ProjectName }

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export: { Name: !Sub "${ProjectName}-DatabaseEndpoint" }
  DatabasePort:
    Value: !GetAtt Database.Endpoint.Port
    Export: { Name: !Sub "${ProjectName}-DatabasePort" }
