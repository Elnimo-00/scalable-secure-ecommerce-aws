AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Edge tier — the public front door. Route 53 hosted zone and DNS-validated ACM
  certificate; the S3 static-assets bucket locked to CloudFront through Origin
  Access Control; the CloudFront distribution; and the Application Load Balancer
  with an HTTPS listener, an HTTP listener that redirects to it, and a rule that
  sends /assets/* to CloudFront. The WAF web ACL is associated here. Deploy after
  the security stack.

Parameters:
  ProjectName:
    Type: String
    Default: enpm818n-grp21
  DomainName:
    Type: String
    Default: enpm818n-grp21.online

Resources:
  HostedZone:
    Type: "AWS::Route53::HostedZone"
    Properties:
      Name: !Ref DomainName

  # DNS-validated automatically in the hosted zone above — no manual CNAME.
  Certificate:
    Type: "AWS::CertificateManager::Certificate"
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZone

  # -- Static assets: private bucket, reachable only through CloudFront ----
  AssetsBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub "${ProjectName}-static-assets-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }

  OriginAccessControl:
    Type: "AWS::CloudFront::OriginAccessControl"
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: "AWS::CloudFront::Distribution"
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} static assets"
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        PriceClass: PriceClass_All
        HttpVersion: http2
        Origins:
          - Id: s3-assets
            DomainName: !GetAtt AssetsBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-assets
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  AssetsBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: "s3:GetObject"
            Resource: !Sub "${AssetsBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # -- Application Load Balancer ------------------------------------------
  LoadBalancer:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - Fn::ImportValue: !Sub "${ProjectName}-AlbSecurityGroupId"
      Subnets:
        - Fn::ImportValue: !Sub "${ProjectName}-PublicSubnetA"
        - Fn::ImportValue: !Sub "${ProjectName}-PublicSubnetB"
      LoadBalancerAttributes:
        - { Key: "routing.http.drop_invalid_header_fields.enabled", Value: "true" }

  TargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: !Sub "${ProjectName}-tg-http"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-VpcId"
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: "/"
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  HttpsListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref Certificate }]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # Port 80 exists only to send users to 443.
  HttpListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  # /assets/* is served from CloudFront, not the app servers.
  AssetsRedirectRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: ["/assets/*"] }
      Actions:
        - Type: redirect
          RedirectConfig:
            Host: !GetAtt Distribution.DomainName
            Protocol: HTTPS
            Port: "443"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301

  WebAclAssociation:
    Type: "AWS::WAFv2::WebACLAssociation"
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn:
        Fn::ImportValue: !Sub "${ProjectName}-WebAclArn"

  # Apex domain points at the load balancer.
  ApexRecord:
    Type: "AWS::Route53::RecordSet"
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        DNSName: !GetAtt LoadBalancer.DNSName

Outputs:
  LoadBalancerArn:
    Value: !Ref LoadBalancer
    Export: { Name: !Sub "${ProjectName}-LoadBalancerArn" }
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
    Export: { Name: !Sub "${ProjectName}-LoadBalancerDnsName" }
  TargetGroupArn:
    Value: !Ref TargetGroup
    Export: { Name: !Sub "${ProjectName}-TargetGroupArn" }
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
    Export: { Name: !Sub "${ProjectName}-CloudFrontDomain" }
  CertificateArn:
    Value: !Ref Certificate
    Export: { Name: !Sub "${ProjectName}-CertificateArn" }
